		<p>
			Type a permutation in one-line notation into the box below and press the enter key to see the equivariant Betti table for the corresponding <b>skew-symmetric</b> matrix Schubert ideal.

					<button class="stabilize" type="button" id="stabilize" disabled="True">Stabilize!</button>
